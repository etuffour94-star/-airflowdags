name: Build and Push Airflow Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Airflow image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/airflow-postgres:latest .

      - name: Push Airflow image
        run: docker push ghcr.io/${{ github.repository_owner }}/airflow-postgres:latest
docker